<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreditFlow — Reparación de Crédito</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F1A;--surface:#131825;--surface-2:#1A2035;--border:#2A3150;--text:#E8ECF4;--text-2:#8B95B0;--text-3:#5A6580;--accent:#4F7CFF;--accent-glow:#4F7CFF33;--green:#34D399;--green-bg:#34D39918;--amber:#FBBF24;--amber-bg:#FBBF2418;--red:#F87171;--red-bg:#F8717118;--purple:#A78BFA;--purple-bg:#A78BFA18;--orange:#FB923C;--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;position:fixed;top:0;left:0;bottom:0;z-index:10;display:flex;flex-direction:column}
.brand{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand h1{font-family:'Playfair Display',serif;font-size:21px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand p{font-size:10px;color:var(--text-3);margin-top:3px;text-transform:uppercase;letter-spacing:1.5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 20px;color:var(--text-2);cursor:pointer;transition:all .2s;font-size:13.5px;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:var(--surface-2)}
.nav-item.active{color:var(--accent);background:var(--accent-glow);border-left-color:var(--accent);font-weight:500}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}
.sidebar-footer p{font-size:11px;color:var(--text-3)}
.main{margin-left:220px;flex:1;padding:28px 36px}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-hdr h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;letter-spacing:-.5px}
.page-hdr .subtitle{font-size:13px;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-glow)}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-ghost{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text-3)}
.btn-danger{background:var(--red-bg);color:var(--red);border:none}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn-export{background:var(--green-bg);color:var(--green);border:none}
.btn-export:hover{background:var(--green);color:#fff}
.btn-wa{background:#25D36618;color:var(--wa);border:none}
.btn-wa:hover{background:var(--wa);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;transition:border-color .2s}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-bottom:24px}
.stat-card{text-align:center}
.stat-val{font-family:'Playfair Display',serif;font-size:32px;font-weight:800;margin-bottom:2px}
.stat-lbl{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px}
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 24px}
.goal-card{padding:18px 20px}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.goal-title{font-size:13px;font-weight:700}
.goal-count{font-size:21px;font-weight:700;white-space:nowrap}
.goal-track{height:9px;margin:12px 0 8px;overflow:hidden;border-radius:99px;background:var(--surface-2)}
.goal-progress{height:100%;border-radius:inherit;background:var(--accent);transition:width .25s ease}
.goal-progress.completed{background:var(--green)}
.goal-caption{font-size:11px;color:var(--text-3)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:none}
.chk-cell{text-align:center}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.chk.checked{background:var(--green);border-color:var(--green)}
.chk.checked::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;width:520px;max-width:92vw;max-height:85vh;overflow-y:auto;animation:slideUp .2s}
.modal-wide{width:620px}
.modal h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:18px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:500;color:var(--text-2);text-transform:uppercase;letter-spacing:.7px}
.fi,.fs,.ft{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 13px;color:var(--text);font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.fs{cursor:pointer}.fs option{background:var(--surface-2)}
.ft{resize:vertical;min-height:70px}
.f-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;grid-column:1/-1}
.act-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0}
.act-time{font-size:11px;color:var(--text-3);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:16px;font-size:11.5px;font-weight:500;white-space:nowrap}
.status-select{border-radius:16px;padding:4px 10px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;text-align:center;min-width:110px;border:1px solid var(--border);background:var(--surface-2);color:var(--text)}
.empty{text-align:center;padding:50px 20px;color:var(--text-3)}
.empty p{font-size:14px;margin-bottom:14px}
.hidden{display:none}
.inline-actions{display:flex;gap:5px}
.search-box{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;width:200px}
.search-box:focus{border-color:var(--accent)}
.date-filter{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.report-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-size:14px;line-height:1.8;white-space:pre-wrap;color:var(--text);max-height:55vh;overflow-y:auto;margin-bottom:16px}
.rpt-section{margin-bottom:10px}
.rpt-title{font-weight:700;margin-bottom:2px}
.copy-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;animation:slideUp .2s}
.status-list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.status-list-item:last-child{border-bottom:none}
.status-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.status-name{flex:1;font-size:14px;font-weight:500}
.color-input{width:36px;height:28px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
.add-status-row{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.add-status-input{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.add-status-input:focus{border-color:var(--accent)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-pill{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);transition:all .2s}
.filter-pill:hover{border-color:var(--text-3);color:var(--text)}
.filter-pill.active{color:#fff}
.bulk-preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:12px 0;max-height:180px;overflow-y:auto;font-size:13px;line-height:1.6}
.bulk-preview .bp-item{display:flex;align-items:center;gap:8px;padding:3px 0}
.bulk-preview .bp-num{color:var(--text-3);font-size:11px;min-width:20px}
.tpl-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.tpl-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tpl-card-hdr span{font-size:13px;font-weight:600}
.tpl-preview{font-size:12.5px;color:var(--text-2);line-height:1.5;white-space:pre-wrap;max-height:60px;overflow:hidden}
.hist-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:default}
.hist-card:hover{border-color:var(--accent)}
.hist-date{font-size:11px;color:var(--text-3);white-space:nowrap;min-width:72px}
.hist-name{font-size:14px;font-weight:600;flex:1}
.hist-stats{display:flex;gap:8px;flex-wrap:wrap}
.hist-pill{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text-2)}
.hist-output{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px 22px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--text);max-height:60vh;overflow-y:auto;margin-bottom:14px;font-family:'DM Sans',sans-serif}
@media(max-width:768px){
  .goal-grid{gap:8px}.goal-card{padding:14px}
  .sidebar{width:58px}.brand h1{font-size:0}.brand p{display:none}
  .nav-item span{display:none}.nav-item{justify-content:center;padding:12px;border-left:none}
  .main{margin-left:58px;padding:16px 12px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}.page-hdr h2{font-size:20px}.sidebar-footer{display:none}
  .filter-bar{gap:5px}
}
/* Usability and responsive refinements */
:root{--surface:#121a2a;--surface-2:#19243a;--border:#2a3956;--accent:#668cff;--accent-glow:#668cff28}
body{background:radial-gradient(ellipse at 82% -10%,#1d2c4a 0,transparent 36%),var(--bg);line-height:1.5}
.sidebar{background:rgba(18,26,42,.96);border-color:#ffffff12;box-shadow:8px 0 32px #00000018}
.brand{padding-bottom:20px}.brand p{letter-spacing:1.2px}
.nav-item{margin:3px 10px;padding:11px 12px;border:0;border-radius:10px}
.nav-item.active{background:linear-gradient(100deg,#668cff22,#a78bfa10);box-shadow:inset 0 0 0 1px #668cff26}
.sidebar-footer{padding:14px 18px}
.main{max-width:1800px;margin-left:220px;padding:34px clamp(18px,3vw,48px)}
.page-hdr{margin-bottom:20px}.page-hdr h2{font-family:'DM Sans',sans-serif;font-size:27px;letter-spacing:-.7px}
.card{border-color:#ffffff12;border-radius:16px;box-shadow:0 12px 30px #00000016}
.btn{min-height:36px;font-weight:600}.btn:focus-visible,.nav-item:focus-visible,.filter-pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:linear-gradient(135deg,#668cff,#4f6fe0);box-shadow:0 5px 16px #668cff30}
.btn-primary:hover{box-shadow:0 8px 22px #668cff42}
.fi,.fs,.ft,.search-box,.date-filter{min-height:40px;border-color:#ffffff18}
.search-box::placeholder,.fi::placeholder{color:#77839d}
.stat-card{position:relative;overflow:hidden;text-align:left;padding:20px}
.stat-card:after{content:"";position:absolute;right:-20px;top:-25px;width:78px;height:78px;border-radius:50%;background:var(--accent-glow);pointer-events:none}
.stat-val{font-family:'DM Sans',sans-serif;font-size:30px}
.stat-lbl{letter-spacing:.7px}
.tbl-wrap{border-radius:10px}
th{position:sticky;top:0;background:var(--surface);z-index:1}
.filter-pill{padding:7px 13px;font:500 12px 'DM Sans',sans-serif;line-height:1.2}
.mobile-more-trigger{display:none}
.filter-pill.active{box-shadow:0 3px 12px #0003}
.report-page-intro{max-width:720px;color:var(--text-2);font-size:13px;margin:-8px 0 18px}
.report-controls{display:grid;grid-template-columns:minmax(180px,1.3fr) repeat(2,minmax(150px,1fr));gap:14px;align-items:end}
.report-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.report-field label{font-size:11px;font-weight:700;letter-spacing:.45px;color:var(--text-2)}
.report-field input,.report-field select{width:100%}
.report-name-field{grid-row:span 1}
.report-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.report-summary-card{display:flex;align-items:center;gap:12px;padding:15px 17px;border:1px solid #ffffff12;background:var(--surface);border-radius:13px}
.report-summary-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.report-summary-value{font-size:21px;font-weight:700;line-height:1.1}
.report-summary-label{font-size:11px;color:var(--text-2);margin-top:3px}
.report-preview-card{padding:0;overflow:hidden}
.report-preview-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 20px;border-bottom:1px solid var(--border)}
.report-preview-title{font-weight:700}.report-preview-hint{font-size:11px;color:var(--text-3);margin-top:2px}
.report-actions{display:flex;gap:8px;flex-wrap:wrap}
.report-preview-card .report-box{margin:16px;max-height:460px}
.report-history-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}
.report-history-list{max-height:420px;overflow:auto}
.saved-report-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 10px;border-bottom:1px solid #ffffff0d;transition:background .15s}
.saved-report-row:hover{background:#ffffff06}
.saved-report-row:last-child{border-bottom:0}
.saved-report-main{min-width:0}.saved-report-title{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.saved-report-meta{font-size:11px;color:var(--text-3);margin-top:3px}
.saved-report-actions{display:flex;gap:6px;flex-shrink:0}
.report-name-hint{font-size:10px;color:var(--text-3)}
.report-empty{padding:22px;text-align:center;color:var(--text-3);font-size:13px}
.report-box{border-color:#ffffff12;background:linear-gradient(145deg,#0d1320,#101726)}
.report-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.report-step{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:11px;color:var(--text-3);font-size:12px}
.report-step-number{display:grid;place-items:center;width:25px;height:25px;flex-shrink:0;border-radius:50%;background:var(--surface-2);font-weight:700}
.report-step.done{border-color:var(--green);color:var(--green)}
.report-step.done .report-step-number{background:var(--green);color:#fff}
.report-step.current{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);font-weight:700}
.report-step.current .report-step-number{background:var(--accent);color:#fff}
.report-flow-hint{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--text-2);font-size:12px}
.report-flow-hint.warning{background:var(--amber-bg);color:var(--amber)}
.backup-reminder{padding:12px 14px;border:1px solid var(--amber);border-radius:11px;background:var(--amber-bg);color:var(--text);font-size:12px;margin-bottom:14px}
.cf-update-notice{position:fixed;top:14px;left:50%;z-index:120;display:flex;align-items:center;gap:12px;width:min(620px,calc(100vw - 24px));padding:12px 14px;transform:translateX(-50%);border:1px solid var(--accent);border-radius:14px;background:var(--surface);box-shadow:0 12px 36px #1e293b30;color:var(--text);font-size:13px}
.cf-update-notice span{flex:1}
.cf-update-notice button{min-height:38px;padding:8px 12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:600 12px 'DM Sans',sans-serif;cursor:pointer}
.cf-update-notice button.cf-update-later{background:var(--surface-2);color:var(--text)}
@media(max-width:900px){
  .report-controls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .report-name-field{grid-column:1/-1}
}
@media(max-width:768px){
  .report-steps{gap:6px}.report-step{padding:9px 7px;gap:6px;font-size:10px}
  .report-step-number{width:22px;height:22px}
  .sidebar{top:auto;right:0;bottom:0;left:0;width:auto;height:64px;padding:5px 4px;flex-direction:row;align-items:stretch;justify-content:space-around;border-top:1px solid var(--border);border-right:0;box-shadow:0 -8px 28px #0005}
  .brand,.sidebar-footer{display:none}
  .nav-item{flex:1;min-width:0;margin:3px 1px;padding:8px 2px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-radius:9px}
  .nav-item span{display:block;font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav-item svg{width:17px;height:17px}
  .main{margin:0;padding:20px 14px 82px}
  .page-hdr{align-items:flex-start}.page-hdr h2{font-size:22px}
  .report-summary{gap:8px}.report-summary-card{padding:12px 9px;gap:8px;align-items:flex-start}
  .report-summary-icon{width:30px;height:30px;font-size:15px}
  .report-summary-value{font-size:18px}.report-summary-label{font-size:10px}
  .report-preview-head{align-items:flex-start;flex-direction:column}
  .report-actions{width:100%}.report-actions .btn{flex:1;justify-content:center}
  .report-preview-card .report-box{margin:12px;padding:15px;font-size:13px}
  .saved-report-row{align-items:flex-start}.saved-report-actions{flex-direction:column}
  .hist-card{flex-wrap:wrap}.hist-name{min-width:calc(100% - 90px)}
  .tbl-wrap table{min-width:1000px}
}
@media(max-width:420px){
  .goal-grid{grid-template-columns:1fr}
  .report-controls{grid-template-columns:1fr}
  .report-name-field{grid-column:auto}
  .report-summary-card{flex-direction:column}
  .report-actions{display:grid;grid-template-columns:1fr 1fr}
  .report-actions .btn:first-child{grid-column:1/-1}
  .page-hdr{gap:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* Light, lower-glare palette with accessible status colors */
:root{
  --bg:#f4f7fc;--surface:#fff;--surface-2:#edf2f9;--border:#d9e2ef;
  --text:#1e293b;--text-2:#52627a;--text-3:#64748b;
  --accent:#315fc4;--accent-glow:#315fc41a;
  --green:#237449;--green-bg:#e8f5ed;
  --amber:#946200;--amber-bg:#fff4d6;
  --red:#b43e48;--red-bg:#fcebed;
  --purple:#6652a6;--purple-bg:#f0ebfb;
  --orange:#a95416;--wa:#147a43
}
body{background:radial-gradient(ellipse at 82% -10%,#e8effb 0,transparent 38%),var(--bg);color:var(--text)}
.sidebar{background:rgba(255,255,255,.94);border-color:var(--border);box-shadow:8px 0 28px #263b5910}
.brand{border-color:var(--border)}
.brand h1{background-image:linear-gradient(135deg,#315fc4,#6652a6)}

}

<div class="app">
  <nav class="sidebar">

    <div class="nav-item active" data-view="dashboard" role="button" tabindex="0" aria-label="Dashboard" title="Dashboard" onclick="nav('dashboard')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('dashboard')}">

<script>
const CREDITFLOW_VERSION = '1.2';
document.getElementById('creditflow-version-label').textContent = `CreditFlow v${CREDITFLOW_VERSION}`;

// ─── STORAGE BRIDGE ───
const CF_STORAGE_KEYS = ['cf_records', 'cf_log', 'cf_statuses', 'cf_templates', 'cf_reports', 'cf_report_name'];
const store = {
  errors: [],
  get(key, def) {
    try {
      if (typeof GM_getValue !== 'undefined') {
        const v = GM_getValue(key, null);
        return v !== null && v !== undefined ? (typeof v === 'string' ? JSON.parse(v) : v) : def;
      }
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch (error) {
      console.error(`CreditFlow: no se pudo leer ${key}`, error);
      this.errors.push(key);
      return def;
    }
  },
  set(key, val) {
    if (typeof GM_setValue !== 'undefined') { GM_setValue(key, JSON.stringify(val)); return; }
    localStorage.setItem(key, JSON.stringify(val));
  },
  isGM() { return typeof GM_getValue !== 'undefined'; }
};

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function compareCreditFlowVersions(a, b) {
  const left = String(a).split('.').map(Number);
  const right = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(left.length, right.length); i++) {
    const difference = (left[i] || 0) - (right[i] || 0);
    if (difference) return difference;
  }
  return 0;
}

function showCreditFlowUpdate(version) {
  if (!version || compareCreditFlowVersions(version, CREDITFLOW_VERSION) <= 0 ||
      document.getElementById('cf-update-notice') ||
      sessionStorage.getItem('cf-dismissed-update') === version) return;
  const notice = document.createElement('div');
  notice.id = 'cf-update-notice';
  notice.className = 'cf-update-notice';
  notice.setAttribute('role', 'status');
  const message = document.createElement('span');
  message.textContent = `CreditFlow ${version} está disponible. Guarda cualquier edición abierta antes de actualizar.`;
  const update = document.createElement('button');
  update.type = 'button';
  update.textContent = 'Actualizar ahora';
  update.addEventListener('click', () => {
    if (!confirm('La página se recargará. ¿Guardaste los cambios del formulario que tienes abierto?')) return;
    const url = new URL(window.location.href);
    url.searchParams.set('v', version);
    window.location.replace(url.href);
  });
  const later = document.createElement('button');
  later.type = 'button';
  later.className = 'cf-update-later';
  later.textContent = 'Más tarde';
  later.addEventListener('click', () => {
    sessionStorage.setItem('cf-dismissed-update', version);
    notice.remove();
  });
  notice.append(message, update, later);
  document.body.appendChild(notice);
}

window.addEventListener('cr-creditflow-update-check', event => {
  showCreditFlowUpdate(event.detail?.version);
});

function eventId(value) {
  return encodeURIComponent(String(value)).replace(/'/g, '%27');
}

function decodeEventId(value) {
  try { return decodeURIComponent(value); }
  catch (error) {
    console.error('CreditFlow: identificador de acción inválido', error);
    return '';
  }
}

function makeId(prefix) {
  const suffix = typeof crypto !== 'undefined' && crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now()}_${Math.random().toString(36).slice(2)}`;
  return `${prefix}_${suffix}`;
}

function ensureUniqueIds(items, prefix) {
  const used = new Set();
  return items.map(item => {
    let id = String(item.id ?? '');
    while (!id || used.has(id)) id = makeId(prefix);
    used.add(id);
    return {...item, id};
  });
}

function normalizeName(value) {
  return String(value || '').trim().replace(/\s+/g, ' ').normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase();
}

function isRecentCase(record) {
  const startedAt = record.createdAt || (record.cartaFecha ? `${record.cartaFecha}T12:00:00` : '');
  const timestamp = new Date(startedAt).getTime();
  const age = Date.now() - timestamp;
  return Number.isFinite(timestamp) && age >= 0 && age < 30 * 24 * 60 * 60 * 1000;
}

function safePulseLink(value) {
  if (!value) return '';
  try {
    const url = new URL(value);
    return url.protocol === 'https:' && url.hostname === 'pulse.disputeprocess.com'
      ? url.href
      : '';
  } catch (error) {
    return '';
  }
}

// Update footer label
document.getElementById('storage-label').textContent =
  store.isGM() ? 'Datos en Tampermonkey (GM)' : 'Datos en este navegador (no sincroniza con GM)';

const DEFAULT_STATUSES = [
  {id:'carta',     label:'Carta',       color:'#237449', numbered:true},
  {id:'espera',    label:'En espera',   color:'#946200', numbered:false},
  {id:'nocontesta',label:'No contesta', color:'#B43E48', numbered:false},
  {id:'cfpb_ftc',  label:'CFPB y FTC',  color:'#6652A6', numbered:false},
];
const GOAL_TARGETS = {completed: 15, letters: 30};

const LEGACY_STATUS_COLORS = {
  carta: '#34D399',
  espera: '#FBBF24',
  nocontesta: '#F87171',
  cfpb_ftc: '#818CF8'
};

const DEFAULT_TEMPLATES = [
  {id:'t1',statusId:'nocontesta',label:'Seguimiento',   msg:'Hola {nombre}, le escribo de parte del equipo de reparación de crédito. Hemos intentado comunicarnos con usted. ¿Podría confirmarnos un buen horario para contactarle? Gracias.'},
  {id:'t2',statusId:'espera',    label:'Actualización', msg:'Hola {nombre}, le informamos que su caso sigue en proceso. Estamos esperando respuesta del buró. Le mantendremos informado. Cualquier duda estamos a la orden.'},
  {id:'t3',statusId:'carta',     label:'Carta enviada', msg:'Hola {nombre}, le confirmamos que su carta de disputa ha sido enviada exitosamente. El proceso puede tomar de 30 a 45 días. Le avisaremos cuando tengamos respuesta.'},
];

// Migrate: guarantee all default statuses are present, defaults appear first in order
function migrateStatuses(saved) {
  if (!Array.isArray(saved)) saved = [];
  saved = saved.filter(s => s && typeof s === 'object' && !Array.isArray(s)).map(s => ({
    ...s,
    id: String(s.id ?? makeId('status')),
    label: String(s.label || 'Sin nombre'),
    color: /^#[\da-f]{6}$/i.test(String(s.color || '')) ? s.color : '#5A6580',
    numbered: Boolean(s.numbered)
  }));
  const custom = saved.filter(s => !DEFAULT_STATUSES.find(d => d.id === s.id));
  const merged = DEFAULT_STATUSES.map(def => {
    const existing = saved.find(s => s.id === def.id);
    if (!existing) return {...def};
    return existing.color.toUpperCase() === LEGACY_STATUS_COLORS[def.id]
      ? {...existing, color: def.color}
      : existing;
  });
  const result = [...merged, ...custom];
  return result;
}

let S = {
  records:   store.get('cf_records',   []),
  log:       store.get('cf_log',       []),
  statuses:  migrateStatuses(store.get('cf_statuses', JSON.parse(JSON.stringify(DEFAULT_STATUSES)))),
  templates: store.get('cf_templates', JSON.parse(JSON.stringify(DEFAULT_TEMPLATES))),
  reports:   store.get('cf_reports', []),
  reportName: store.get('cf_report_name', 'Nombre'),
  view: 'dashboard',
  search: '',
  filterStatus: 'all',
  reportDate: '',
  reportResp: '',
  recordSort: 'oldest',
};
if (!Array.isArray(S.records)) { store.errors.push('cf_records'); S.records = []; }
if (!Array.isArray(S.log)) { store.errors.push('cf_log'); S.log = []; }
if (!Array.isArray(S.templates)) { store.errors.push('cf_templates'); S.templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); }
if (!Array.isArray(S.reports)) { store.errors.push('cf_reports'); S.reports = []; }
if (typeof S.reportName !== 'string') { store.errors.push('cf_report_name'); S.reportName = 'Nombre'; }
S.reportName = S.reportName.trim() || 'Nombre';
[
  ['cf_records', S.records],
  ['cf_log', S.log],
  ['cf_statuses', S.statuses],
  ['cf_templates', S.templates],
  ['cf_reports', S.reports]
].forEach(([key, collection]) => {
  if (collection.some(item => !item || typeof item !== 'object' || Array.isArray(item))) {
    store.errors.push(key);
  }
});
S.records = S.records.filter(r => r && typeof r === 'object' && !Array.isArray(r)).map(r => ({
  ...r,
  id: String(r.id ?? makeId('record')),
  nombre: String(r.nombre ?? ''),
  nombreResp: String(r.nombreResp || 'Manuelbis'),
  estatus: String(r.estatus || ''),
  carta: Boolean(r.carta),
  cartaFecha: String(r.cartaFecha || ''),
  cfbp: Boolean(r.cfbp),
  cfbpFecha: String(r.cfbpFecha || ''),
  archived: Boolean(r.archived),
  comentario: String(r.comentario || ''),
  link: String(r.link || ''),
  phone: String(r.phone || ''),
  createdAt: String(r.createdAt || ''),
  notes: Array.isArray(r.notes) ? r.notes.filter(n => n && typeof n === 'object' && !Array.isArray(n)).map(n => ({
    ...n, id: String(n.id ?? makeId('note')), text: String(n.text || ''),
    ts: String(n.ts || r.createdAt || new Date().toISOString())
  })) : []
}));
S.records = ensureUniqueIds(S.records, 'record');
S.log = S.log.filter(item => item && typeof item === 'object' && !Array.isArray(item)).map(item => ({
  ...item, id: String(item.id ?? makeId('log')), type: String(item.type || ''),
  desc: String(item.desc || ''), ts: String(item.ts || new Date().toISOString())
}));
S.log = ensureUniqueIds(S.log, 'log');
S.templates = S.templates.filter(item => item && typeof item === 'object' && !Array.isArray(item)).map(item => ({
  ...item, id: String(item.id ?? makeId('template')), statusId: String(item.statusId || ''),
  label: String(item.label || ''), msg: String(item.msg || '')
}));
S.templates = ensureUniqueIds(S.templates, 'template');
S.reports = S.reports.filter(report => report && typeof report === 'object' && !Array.isArray(report)).map(report => ({
  ...report,
  id: String(report.id ?? makeId('report')),
  generatedAt: String(report.generatedAt || ''),
  reportDate: String(report.reportDate || ''),
  reportName: String(report.reportName || 'Nombre'),
  responsable: String(report.responsable || 'Todos'),
  total: Number.isInteger(report.total) && report.total >= 0 ? report.total : 0,
  content: String(report.content || ''),
  clients: Array.isArray(report.clients) ? report.clients.filter(client => client && typeof client === 'object' && !Array.isArray(client)).map(client => ({
    nombre: String(client.nombre || 'Sin nombre'),
    estatus: String(client.estatus || ''),
    completed: Boolean(client.completed)
  })) : []
}));
S.reports = ensureUniqueIds(S.reports, 'report');
S.records.forEach(r => { if (!r.estatus) r.estatus = ''; });

const save = () => {
  const unreadableKeys = store.errors.filter(key => CF_STORAGE_KEYS.includes(key));
  if (unreadableKeys.length) {
    showToast(`No se guardó: hay datos ilegibles en ${unreadableKeys.join(', ')}. Exporta o revisa el almacenamiento antes de continuar.`, 'var(--red)');
    return false;
  }
  try {
    store.set('cf_records',   S.records);
    store.set('cf_log',       S.log);
    store.set('cf_statuses',  S.statuses);
    store.set('cf_templates', S.templates);
    store.set('cf_reports',   S.reports);
    store.set('cf_report_name', S.reportName);
  } catch (error) {
    console.error('CreditFlow: no se pudieron guardar los cambios', error);
    showToast('No se pudieron guardar los cambios. Revisa el almacenamiento del navegador.', 'var(--red)');
    return false;
  }
  return true;
};

function nav(v) {
  S.view = v;
  document.querySelectorAll('.nav-item[data-view]').forEach(el => {
    const active = el.dataset.view === v;
    el.classList.toggle('active', active);
    if (active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });
  const moreTrigger = document.getElementById('mobileMoreTrigger');
  const moreMenu = document.getElementById('mobileMoreMenu');
  const menuWasOpen = Boolean(moreMenu && !moreMenu.hidden);
  const isMoreView = ['plantillas', 'historial', 'activity', 'ajustes'].includes(v);
  moreTrigger?.classList.toggle('active', isMoreView);
  moreTrigger?.setAttribute('aria-expanded', 'false');
  if (moreMenu) moreMenu.hidden = true;
  if (menuWasOpen && isMoreView) moreTrigger?.focus();
  ['dashboard','reparacion','reportes','plantillas','historial','activity','ajustes'].forEach(x =>
    document.getElementById('v-'+x).classList.toggle('hidden', x !== v));
  render();
}

function toggleMobileMore() {
  const trigger = document.getElementById('mobileMoreTrigger');
  const menu = document.getElementById('mobileMoreMenu');
  if (!trigger || !menu) return;
  menu.hidden = !menu.hidden;
  trigger.setAttribute('aria-expanded', String(!menu.hidden));
  if (!menu.hidden) menu.querySelector('button')?.focus();
}

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const menu = document.getElementById('mobileMoreMenu');
  const trigger = document.getElementById('mobileMoreTrigger');
  if (menu && !menu.hidden) {
    menu.hidden = true;
    trigger?.setAttribute('aria-expanded', 'false');
    trigger?.focus();
  }
});

document.addEventListener('click', event => {
  const menu = document.getElementById('mobileMoreMenu');
  const trigger = document.getElementById('mobileMoreTrigger');
  if (!menu || menu.hidden || menu.contains(event.target) || trigger?.contains(event.target)) return;
  menu.hidden = true;
  trigger?.setAttribute('aria-expanded', 'false');
});

function saveRecord(eid) {
  eid = decodeEventId(eid);
  const nombre = document.getElementById('r-nombre').value.trim();
  if (!nombre) return;
  const recentCases = S.records.filter(r =>
    r.id !== eid && normalizeName(r.nombre) === normalizeName(nombre) && isRecentCase(r)
  );
  if (!eid && recentCases.length && !confirm(
    `Ya hay ${recentCases.length} proceso${recentCases.length === 1 ? '' : 's'} de ${nombre} iniciado${recentCases.length === 1 ? '' : 's'} en los últimos 30 días. ¿Agregar un proceso nuevo e independiente?`
  )) {
    return;
  }
  const linkInput = document.getElementById('r-link').value.trim();
  const link = safePulseLink(linkInput);
  if (linkInput && !link) {
    showToast('El enlace debe ser una URL HTTPS válida de pulse.disputeprocess.com.', 'var(--red)');
    return;
  }
  const data = {
    nombre,
    nombreResp: document.getElementById('r-resp').value.trim() || 'Manuelbis',
    estatus:    document.getElementById('r-estatus').value,
    cartaFecha: document.getElementById('r-cartaFecha').value,
    cfbpFecha:  document.getElementById('r-cfbpFecha').value,
    comentario: document.getElementById('r-comentario').value.trim(),
    link,
    phone:      document.getElementById('r-phone').value.replace(/\D/g,'')
  };
  if (eid) {
    const idx = S.records.findIndex(r => r.id === eid);
    if (idx < 0) { showToast('No se encontró el registro para editar.', 'var(--red)'); return; }
    S.records[idx] = {...S.records[idx], ...data};
    addLog('edit', 'Editado: ' + data.nombre);
  } else {
    data.id = makeId('record');
    data.carta = false;
    data.cfbp = false;
    data.archived = false;
    data.createdAt = new Date().toISOString();
    S.records.push(data);
    addLog('add', 'Nuevo: ' + data.nombre);
  }
  save(); closeModal(); render();
}

function previewBulk() {
  const names = document.getElementById('b-names').value.split('\n').map(n => n.trim()).filter(Boolean);
  if (!names.length) { document.getElementById('b-preview').innerHTML = ''; return; }
  const existing = new Map();
  S.records.forEach(record => {
    const key = normalizeName(record.nombre);
    existing.set(key, (existing.get(key) || false) || isRecentCase(record));
  });
  const seenInBatch = new Set();
  let newCount = 0;
  let recentCount = 0;
  const rows = names.map((name, i) => {
    const key = normalizeName(name);
    const repeatedInBatch = seenInBatch.has(key);
    const recentCase = existing.get(key) === true;
    const existingCase = existing.has(key);
    if (!repeatedInBatch) {
      seenInBatch.add(key);
      newCount++;
      if (recentCase) recentCount++;
    }
    const note = repeatedInBatch
      ? ' <span class="badge">Repetido en la lista — se omitirá</span>'
      : recentCase
        ? ' <span class="badge">Proceso reciente — pedirá confirmación</span>'
        : existingCase
          ? ' <span class="badge">Proceso anterior — nuevo sin aviso</span>'
          : '';
    return `<div class="bp-item"><span class="bp-num">${i+1}.</span> ${escapeHtml(name)}${note}</div>`;
  }).join('');
  document.getElementById('b-preview').innerHTML = `
    <div class="bulk-preview">${rows}</div>
    <div style="font-size:12px;color:var(--text-2)">${newCount} proceso${newCount===1?'':'s'} nuevo${newCount===1?'':'s'} se agregarán; ${names.length-newCount} repetido${names.length-newCount===1?'':'s'} dentro de la lista se omitirá${names.length-newCount===1?'':'n'}.${recentCount ? ` ${recentCount} tienen un proceso iniciado en los últimos 30 días.` : ''}</div>`;
}

function executeBulk() {
  const names = document.getElementById('b-names').value.split('\n').map(n => n.trim()).filter(Boolean);
  if (!names.length) return;
  const resp   = document.getElementById('b-resp').value.trim() || 'Manuelbis';
  const estatus= document.getElementById('b-estatus').value;
  const fecha  = document.getElementById('b-fecha').value;
  const seenInBatch = new Set();
  const recentExisting = new Set(S.records.filter(isRecentCase).map(r => normalizeName(r.nombre)));
  const repeatedRecent = new Set(names.map(normalizeName).filter(name => recentExisting.has(name)));
  if (repeatedRecent.size && !confirm(
    `${repeatedRecent.size} nombre${repeatedRecent.size === 1 ? ' ya tiene' : 's ya tienen'} proceso${repeatedRecent.size === 1 ? '' : 's'} iniciado${repeatedRecent.size === 1 ? '' : 's'} en los últimos 30 días. ¿Agregarlo${repeatedRecent.size === 1 ? '' : 's'} como proceso${repeatedRecent.size === 1 ? '' : 's'} nuevo${repeatedRecent.size === 1 ? '' : 's'}?`
  )) {
    return;
  }
  let count = 0;
  let skipped = 0;
  names.forEach(nombre => {
    const key = normalizeName(nombre);
    if (seenInBatch.has(key)) { skipped++; return; }
    seenInBatch.add(key);
    S.records.push({id:makeId('record'), nombre, nombreResp:resp, estatus, carta:false, cfbp:false, cartaFecha:fecha, cfbpFecha:'', archived:false, comentario:'', createdAt:new Date().toISOString()});
    count++;
  });
  if (!count) { showToast('No se agregaron registros: todos eran duplicados.', 'var(--orange)'); return; }
  addLog('bulk', `${count} clientes agregados en lote`);
  save(); closeModal(); render();
  showToast(`✓ ${count} agregados; ${skipped} duplicados omitidos`);
}

function clearAllData() {
  const customStatuses = S.statuses.filter(status =>
    !DEFAULT_STATUSES.some(defaultStatus => defaultStatus.id === status.id)
  ).length;
  const summary = [
    `${S.records.length} clientes`,
    `${S.log.length} actividades`,
    `${customStatuses} estatus personalizados`,
    `${S.templates.length} plantillas`,
    `${S.reports.length} reportes guardados`
  ].join(', ');
  const confirmed = confirm(
    `Vas a borrar todo CreditFlow: ${summary}. ` +
    'Los estatus volverán a los predeterminados. El historial de CreditRadar no se borrará. Esta acción no se puede deshacer. ¿Continuar?'
  );
  if (!confirmed) return;

  const previous = {
    records: S.records,
    log: S.log,
    statuses: S.statuses,
    templates: S.templates,
    reports: S.reports,
    filterStatus: S.filterStatus,
    search: S.search
  };
  S.records = [];
  S.log = [];
  S.statuses = JSON.parse(JSON.stringify(DEFAULT_STATUSES));
  S.templates = [];
  S.reports = [];
  S.filterStatus = 'all';
  S.search = '';

  if (!save()) {
    Object.assign(S, previous);
    render();
    return;
  }
  render();
  showToast('CreditFlow quedó limpio; se conservaron los estatus predeterminados.');
}

  const msg = tpl.msg

    .replace(/\{responsable\}/g, r.nombreResp)
    .replace(/\{fecha\}/g, r.cartaFecha || '');

    ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank', 'noopener,noreferrer');

      <div class="fg"><label class="fl">Nombre de Plantilla</label><input class="fi" id="tpl-label" value="${escapeHtml(t.label)}" placeholder="Ej: Seguimiento"></div>
      <div class="fg"><label class="fl">Estatus Asociado</label>
        <select class="fs" id="tpl-status"><option value="">Todos los estatus</option>${sOpts}</select>
      </div>
      <div class="fg full"><label class="fl">Mensaje</label>
        <textarea class="ft" id="tpl-msg" style="min-height:120px" placeholder="Hola {nombre}, ...">${escapeHtml(t.msg)}</textarea>
      </div>
      <div class="f-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveTemplate('${eventId(existing?t.id:'')}')">${existing?'Guardar':'Crear'}</button>
      </div>
    </div>
  </div></div>`;
}

function saveTemplate(eid) {
  eid = decodeEventId(eid);
  const label = document.getElementById('tpl-label').value.trim();
  const msg   = document.getElementById('tpl-msg').value.trim();
  if (!label || !msg) return;
  const data = {label, statusId: document.getElementById('tpl-status').value, msg};
  if (eid) {
    const idx = S.templates.findIndex(t => t.id === eid);
    if (idx < 0) { showToast('No se encontró la plantilla para editar.', 'var(--red)'); return; }
    S.templates[idx] = {...S.templates[idx], ...data};
  } else {
    data.id = makeId('template');
    S.templates.push(data);
  }
  save(); closeModal(); render();
}

function deleteTemplate(id) {
  if (!confirm('¿Eliminar esta plantilla?')) return;
  S.templates = S.templates.filter(t => t.id !== id);
  save(); render();
}

function setReportName(value) {
  const previous = S.reportName;
  S.reportName = String(value || '').trim().slice(0, 100) || 'Nombre';
  if (!save()) {
    S.reportName = previous;
    const input = document.getElementById('rpt-name');
    if (input) input.value = previous;
    previewReportName(previous);
    return;
  }
  previewReportName(S.reportName);
  showToast('Nombre del reporte guardado.');
}

function previewReportName(value) {
  const name = String(value || '').trim().slice(0, 100) || 'Nombre';
  const title = document.getElementById('report-preview-name');
  if (title) title.textContent = `Vista previa · ${name}`;
  const preview = document.getElementById('report-preview-content');
  if (preview) preview.innerHTML = generateReportHTML(S.reportDate, S.reportResp, name);
}

function filterSavedReports(value) {
  const query = String(value || '').trim().toLocaleLowerCase();
  const rows = [...document.querySelectorAll('.saved-report-row')];
  let visible = 0;
  rows.forEach(row => {
    const matches = !query || row.dataset.search.includes(query);
    row.hidden = !matches;
    if (matches) visible++;
  });
  const count = document.getElementById('saved-report-count');
  if (count) count.textContent = `${visible} de ${rows.length} reporte${rows.length === 1 ? '' : 's'}`;
  const empty = document.getElementById('saved-report-search-empty');
  if (empty) empty.hidden = visible > 0;
}

// ─── REPORT ───
function getFilteredForReport(date, resp) {
  return S.records.filter(r => {
    if (r.archived) return false;
    const completed = r.carta && r.cfbp;
    const completionDate = r.cfbpFecha || r.cartaFecha;
    const completionReport = completed && (!date || completionDate === date);
    const activeReport = !completed && (
      r.estatus === 'espera' || !date || r.cartaFecha === date
    );
    const mR = !resp || String(r.nombreResp || '').toLowerCase().includes(resp.toLowerCase());
    return (completionReport || activeReport) && mR;
  });
}

function generateReportText(date, resp, reportName = S.reportName) {
  const f = getFilteredForReport(date, resp);
  const completed = f.filter(r => r.carta && r.cfbp);
  const active = f.filter(r => !(r.carta && r.cfbp));
  let t = reportName + '\n' + fmtDateShort(date || today()) + '\n';
  S.statuses.forEach(st => {
    const g = active.filter(r => r.estatus === st.id);
    if (!g.length) return;
    t += '\n' + st.label + ':\n';
    g.forEach((r, i) => { t += st.numbered ? (i+1)+'. '+r.nombre+'\n' : r.nombre+'\n'; });
  });
  const ns = active.filter(r => !r.estatus || !getStatus(r.estatus));
  if (ns.length) { t += '\nSin estatus:\n'; ns.forEach(r => { t += r.nombre + '\n'; }); }
  if (completed.length) {
    t += '\nCompletados (CFPB y FTC):\n';
    completed.forEach((r, i) => { t += (i+1)+'. '+r.nombre+'\n'; });
  }
  if (!f.length) t += '\nSin registros para esta fecha.\n';
  return t.trim();
}

function generateReportHTML(date, resp, reportName = S.reportName) {
  const f = getFilteredForReport(date, resp);
  const completed = f.filter(r => r.carta && r.cfbp);
  const active = f.filter(r => !(r.carta && r.cfbp));
  let h = `<div class="report-preview-name" style="font-weight:700;font-size:16px">${escapeHtml(reportName)}</div><div style="color:var(--text-2);margin-bottom:14px">${escapeHtml(fmtDateShort(date || today()))}</div>`;
  S.statuses.forEach(st => {
    const g = active.filter(r => r.estatus === st.id);
    if (!g.length) return;
    h += `<div class="rpt-section"><div class="rpt-title" style="color:${statusColor(st.id)}">${escapeHtml(st.label)}:</div>`;
    g.forEach((r, i) => { h += `<div>${st.numbered ? (i+1)+'. ' : ''}${escapeHtml(r.nombre)}</div>`; });
    h += '</div>';
  });
  const ns = active.filter(r => !r.estatus || !getStatus(r.estatus));
  if (ns.length) {
    h += '<div class="rpt-section"><div class="rpt-title" style="color:var(--text-3)">Sin estatus:</div>';
    ns.forEach(r => { h += `<div>${escapeHtml(r.nombre)}</div>`; });
    h += '</div>';
  }
  if (completed.length) {
    h += '<div class="rpt-section"><div class="rpt-title" style="color:var(--green)">Completados (CFPB y FTC):</div>';
    completed.forEach((r, i) => { h += `<div>${i+1}. ${escapeHtml(r.nombre)}</div>`; });
    h += '</div>';
  }
  if (!f.length) h += '<div style="color:var(--text-3);text-align:center;padding:20px">Sin registros para estos filtros.</div>';
  return h;
}

function copyReport() {
  const date = document.getElementById('rpt-date')?.value || '';
  const resp = document.getElementById('rpt-resp')?.value || '';
  if (!getFilteredForReport(date, resp).length) {
    showToast('No hay clientes para copiar. Revisa la fecha y el responsable.', 'var(--orange)');
    return;
  }
  const text = generateReportText(
    date,
    resp
  );
  navigator.clipboard.writeText(text)
    .then(() => showToast('✓ Copiado'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✓ Copiado');
    });
}

function generateSavedReport() {
  const date = document.getElementById('rpt-date')?.value || today();
  const resp = document.getElementById('rpt-resp')?.value || '';
  const entries = getFilteredForReport(date, resp);
  if (!entries.length) {
    showToast('No hay clientes para este reporte. Revisa la fecha y el responsable.', 'var(--orange)');
    return;
  }
  const responsable = resp || 'Todos';
  const existingReport = S.reports.find(report =>
    report.reportDate === date && report.responsable === responsable
  );
  if (existingReport && !confirm(`Ya existe un reporte para ${fmtDateShort(date)} (${responsable}). ¿Quieres guardar otra copia?`)) return;
  const previousName = S.reportName;
  S.reportName = String(document.getElementById('rpt-name')?.value || '').trim().slice(0, 100) || 'Nombre';
  const report = {
    id: makeId('report'),
    generatedAt: new Date().toISOString(),
    reportDate: date,
    reportName: S.reportName,
    responsable,
    total: entries.length,
    content: generateReportText(date, resp),
    clients: entries.map(record => ({
      nombre: record.nombre,
      estatus: record.carta && record.cfbp
        ? 'Completados (CFPB y FTC)'
        : statusLabel(record.estatus),
      completed: Boolean(record.carta && record.cfbp)
    }))
  };
  const previousLog = S.log.slice();
  S.reports.unshift(report);
  addLog('report', `Reporte generado: ${fmtDateShort(date)} · ${report.total} cliente${report.total === 1 ? '' : 's'}`);
  if (!save()) {
    S.reports.shift();
    S.log = previousLog;
    S.reportName = previousName;
    return;
  }
  render();
  showToast('Reporte generado y guardado en el historial.');
}

function showSavedReport(id) {
  const report = S.reports.find(item => item.id === id);
  if (!report) return;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="closeModal()"><div class="modal modal-wide" onclick="event.stopPropagation()">
    <h3>${escapeHtml(report.reportName || 'Nombre')} — ${escapeHtml(fmtDateShort(report.reportDate))}</h3>
    <div style="font-size:12px;color:var(--text-3);margin-top:-10px;margin-bottom:14px">
      Generado ${escapeHtml(fmtHistDate(report.generatedAt))} · ${escapeHtml(report.responsable)} · ${report.total} cliente${report.total === 1 ? '' : 's'}
    </div>
    <pre class="report-box" style="max-height:50vh">${escapeHtml(report.content)}</pre>
    <div class="f-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="copySavedReport(decodeEventId('${eventId(report.id)}'))">📋 Copiar</button>
    </div>
  </div></div>`;
}

function copySavedReport(id) {
  const report = S.reports.find(item => item.id === id);
  if (!report) return;
  navigator.clipboard.writeText(report.content)
    .then(() => showToast('✓ Reporte copiado'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = report.content;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✓ Reporte copiado');
    });
}

// ─── HISTORIAL ───
let historyReadWarningShown = false;
function loadHistory() {
  const entries = store.get('cr_history', []);
  if (!Array.isArray(entries)) {
    console.error('CreditFlow: el historial almacenado no tiene el formato esperado.');
    if (!historyReadWarningShown) {
      showToast('El historial guardado tiene un formato inválido.', 'var(--red)');
      historyReadWarningShown = true;
    }
    return [];
  }
  return entries.filter(e => e && typeof e === 'object' && !Array.isArray(e)).map(e => ({
    ...e,
    clientName: String(e.clientName || 'Sin nombre'),
    output: String(e.output || ''),
    stats: e.stats && typeof e.stats === 'object' ? e.stats : {}
  }));
}

function fmtHistDate(id) {
  const d = new Date(id);
  return d.toLocaleDateString('es', {day:'numeric', month:'short', year:'numeric'}) + ' ' +
    d.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
}

function showHistorialOutput(index) {
  const entry = loadHistory()[index];
  if (!entry) return;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="closeModal()"><div class="modal modal-wide" onclick="event.stopPropagation()">
    <h3>${escapeHtml(entry.clientName)}</h3>
    <div style="font-size:11px;color:var(--text-3);margin-bottom:14px">${escapeHtml(fmtHistDate(entry.id))}</div>
    <div class="hist-output">${escapeHtml(entry.output)}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-primary btn-sm" onclick="copyHistOutput(${index})">📋 Copiar</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cerrar</button>
    </div>
  </div></div>`;
}

function copyHistOutput(index) {
  const entries = loadHistory();
  const e = entries[index];
  if (!e) return;
  navigator.clipboard.writeText(e.output || '')
    .then(() => showToast('✓ Copiado'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = e.output || '';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      showToast('✓ Copiado');
    });
}

function renderHistorial() {
  const entries = loadHistory();
  const search = document.getElementById('hist-search');
  const hadFocus = document.activeElement === search;
  const selectionStart = hadFocus ? search.selectionStart : null;
  const selectionEnd = hadFocus ? search.selectionEnd : null;
  const sv = search?.value || '';
  const fil = entries.map((entry, index) => ({entry, index})).filter(({entry}) =>
    !sv || entry.clientName.toLowerCase().includes(sv.toLowerCase()));

  const rows = fil.map(({entry: e, index}) => {
    const s = e.stats || {};
    const pills = [
      Number(s.accounts)  ? `${escapeHtml(Number(s.accounts))} cuentas`   : '',
      Number(s.inquiries) ? `${escapeHtml(Number(s.inquiries))} inquiries` : '',
      Number(s.personal)  ? `${escapeHtml(Number(s.personal))} personal`   : '',
    ].filter(Boolean).map(p => `<span class="hist-pill">${p}</span>`).join('');
    return `<div class="hist-card" onclick="showHistorialOutput(${index})">
      <div class="hist-date">${escapeHtml(fmtHistDate(e.id))}</div>
      <div class="hist-name">${escapeHtml(e.clientName)}</div>
      <div class="hist-stats">${pills}</div>
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();copyHistOutput(${index})" title="Copiar">📋</button>
    </div>`;
  }).join('');

  document.getElementById('v-historial').innerHTML = `
    <div class="page-hdr"><h2>Historial</h2>
      <input class="search-box" id="hist-search" placeholder="Buscar cliente..." value="${escapeHtml(sv)}" oninput="renderHistorial()" style="width:220px">
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--text-3);margin-bottom:14px">${fil.length} de ${entries.length} registros</div>
      ${rows || '<div class="empty"><p>Sin historial</p></div>'}
    </div>`;
  if (hadFocus) {
    const updatedSearch = document.getElementById('hist-search');
    updatedSearch.focus();
    updatedSearch.setSelectionRange(selectionStart, selectionEnd);
  }
}

// ─── RENDER ───
function render() {
  const activeSearch = document.getElementById('search-input');
  const searchHasFocus = document.activeElement === activeSearch;
  const searchSelection = searchHasFocus
    ? [activeSearch.selectionStart, activeSearch.selectionEnd]
    : null;
  const sortHasFocus = document.activeElement?.id === 'sort-records';
  const t = today();
  const activeRecords = S.records.filter(r => !r.archived);
  const archivedCount = S.records.length - activeRecords.length;
  const total = activeRecords.length;
  const todayCount = S.log.filter(l => l.ts.startsWith(t)).length;
  const monthKey = t.slice(0, 7);
  const monthLabel = new Date(`${monthKey}-01T12:00:00`).toLocaleDateString('es', {month:'long', year:'numeric'});
  const dailyLetters = S.records.filter(r => r.carta && r.cartaFecha === t).length;
  const monthlyCompletions = S.records.filter(r =>
    r.carta && r.cfbp && String(r.cfbpFecha || '').startsWith(monthKey)
  ).length;
  const goalCard = (title, count, goal, period, periodLabel, colorClass = '') => {
    const percent = Math.min(100, Math.round(count / goal * 100));
    return `<div class="card goal-card">
      <div class="goal-head">
        <div class="goal-title">${title}</div>
        <div class="goal-count">${count} <span style="font-size:12px;color:var(--text-3);font-weight:500">/ ${goal}</span></div>
      </div>
      <div class="goal-track" role="progressbar" aria-label="${title}" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${Math.min(count, goal)}">
        <div class="goal-progress ${colorClass}" style="width:${percent}%"></div>
      </div>
      <div class="goal-caption">${percent >= 100 ? `Meta ${period} alcanzada` : `${percent}% de la meta ${period}`} · ${escapeHtml(periodLabel)}</div>
    </div>`;
  };
  const statusCounts = {};
  S.statuses.forEach(st => { statusCounts[st.id] = activeRecords.filter(r => r.estatus === st.id).length; });

  // DASHBOARD
  const recentActs = S.log.filter(l => l.ts.startsWith(t)).slice(-8).reverse()
    .map(l => `<div class="act-item"><span class="act-dot" style="background:${actColor(l.type)}"></span><div style="flex:1"><div style="font-size:13px">${escapeHtml(l.desc)}</div><div class="act-time">${escapeHtml(fmtTime(l.ts))}</div></div></div>`).join('')
    || '<p style="color:var(--text-3);font-size:13px;padding:20px;text-align:center">Sin actividad hoy.</p>';

  const recentRows = activeRecords.slice(-5).reverse().map(r => {
    const c = statusColor(r.estatus);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
      <div><div style="font-size:13.5px;font-weight:500">${escapeHtml(r.nombre)}</div><div style="font-size:11px;color:var(--text-3)">${escapeHtml(r.nombreResp)} · ${escapeHtml(r.cartaFecha||'—')}</div></div>
      <span class="badge" style="background:${c}18;color:${c}">${escapeHtml(statusLabel(r.estatus))}</span>
    </div>`;
  }).join('') || '<p style="color:var(--text-3);font-size:13px">Sin registros.</p>';

  document.getElementById('v-dashboard').innerHTML = `
    <div class="page-hdr"><h2>Dashboard</h2><span class="subtitle">${fmtLong()}</span></div>
    <div class="stat-grid">
      <div class="card stat-card"><div class="stat-val" style="color:var(--accent)">${total}</div><div class="stat-lbl">Total</div></div>
      ${S.statuses.map(st => `<div class="card stat-card"><div class="stat-val" style="color:${statusColor(st.id)}">${statusCounts[st.id]||0}</div><div class="stat-lbl">${escapeHtml(st.label)}</div></div>`).join('')}
      <div class="card stat-card"><div class="stat-val" style="color:var(--text-2)">${todayCount}</div><div class="stat-lbl">Acciones Hoy</div></div>
    </div>
    <div class="goal-grid" aria-label="Metas de trabajo">
      ${goalCard('Cartas hechas hoy', dailyLetters, GOAL_TARGETS.letters, 'diaria', new Date(`${t}T12:00:00`).toLocaleDateString('es', {weekday:'long', day:'numeric', month:'long'}))}
      ${goalCard('Procesos completados (CFPB y FTC)', monthlyCompletions, GOAL_TARGETS.completed, 'mensual', monthLabel, 'completed')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="card"><div style="font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text-2)">Últimos Registros</div>${recentRows}</div>
      <div class="card"><div style="font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text-2)">Actividad Hoy</div>${recentActs}</div>
    </div>`;

  // REPARACIÓN
  const searchInput = document.getElementById('search-input');
  const sv = searchInput ? searchInput.value : S.search;
  S.search = sv;
  const query = normalizeName(sv);
  let fil = S.records.filter(r => {
    if (Boolean(r.archived) !== (S.filterStatus === 'archived')) return false;
    const searchable = normalizeName([
      r.nombre, r.nombreResp, r.phone, r.comentario, r.cartaFecha, r.cfbpFecha,
      statusLabel(r.estatus)
    ].filter(Boolean).join(' '));
    return searchable.includes(query);
  });
  if (S.filterStatus !== 'all' && S.filterStatus !== 'archived') {
    fil = fil.filter(r => S.filterStatus === 'none' ? !r.estatus : r.estatus === S.filterStatus);
  }
  const recordDate = r => {
    const timestamp = new Date(r.createdAt || 0).getTime();
    return Number.isFinite(timestamp) ? timestamp : 0;
  };
  fil.sort((a, b) => {
    if (S.recordSort === 'name') return normalizeName(a.nombre).localeCompare(normalizeName(b.nombre), 'es');
    const difference = recordDate(a) - recordDate(b);
    return S.recordSort === 'newest' ? -difference : difference;
  });

  const tRows = fil.map(r => {
    const opts = S.statuses.map(s => `<option value="${escapeHtml(s.id)}" ${r.estatus===s.id?'selected':''}>${escapeHtml(s.label)}</option>`).join('') +
      `<option value="" ${!r.estatus?'selected':''}>—</option>`;
    const sc = statusColor(r.estatus);
    const days = r.createdAt ? Math.floor((Date.now()-new Date(r.createdAt).getTime())/86400000) : '—';
    const daysColor = days === '—' ? 'var(--text-3)' : days > 60 ? '#f87171' : days > 30 ? '#fbbf24' : 'var(--text-2)';
    const notesCount = (r.notes||[]).length;
    return `<tr>
      <td style="font-weight:500;min-width:180px">${escapeHtml(r.nombre)}</td>
      <td>${escapeHtml(r.nombreResp)}</td>
      <td><select class="status-select" style="background:${sc}18;color:${sc};border-color:${sc}" onchange="changeEstatus(decodeEventId('${eventId(r.id)}'),this.value)">${opts}</select></td>
      <td class="chk-cell"><div class="chk ${r.carta?'checked':''}" onclick="toggleCarta(decodeEventId('${eventId(r.id)}'))"></div></td>
      <td style="color:var(--text-2);font-size:12.5px;white-space:nowrap">${escapeHtml(r.cartaFecha||'—')}</td>
      <td class="chk-cell"><div class="chk ${r.cfbp?'checked':''}" onclick="toggleCfbp(decodeEventId('${eventId(r.id)}'))"></div></td>
      <td style="color:var(--text-2);font-size:12.5px;white-space:nowrap">${escapeHtml(r.cfbpFecha||'—')}</td>
      <td style="color:var(--text-2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.comentario||'—')}</td>
      <td style="color:${daysColor};font-size:12px;white-space:nowrap;text-align:center">${days === '—' ? '—' : days+'d'}</td>
      <td><div class="inline-actions">
        ${safePulseLink(r.link) ? `<a class="btn btn-primary btn-sm" href="${escapeHtml(safePulseLink(r.link))}" target="_blank" rel="noopener noreferrer" title="Ir a perfil en Pulse">🔗 Ir</a>` : `<button class="btn btn-ghost btn-sm" style="opacity:.35;cursor:not-allowed" title="Edita el registro para agregar el link de Pulse" disabled>🔗 Ir</button>`}
        <button class="btn btn-ghost btn-sm" onclick="showNotesModal(decodeEventId('${eventId(r.id)}'))" title="Notas${notesCount?' ('+notesCount+')':''}">📝${notesCount?`<span style="font-size:9px;margin-left:2px">${notesCount}</span>`:''}</button>
        <button class="btn btn-wa btn-sm" onclick="showWhatsAppModal(decodeEventId('${eventId(r.id)}'))" title="WhatsApp">📲</button>

// ─── EXPORT / IMPORT ───
function exportData() {
  const data = JSON.stringify({records:S.records,statuses:S.statuses,templates:S.templates,log:S.log,reports:S.reports,reportName:S.reportName}, null, 2);
  const d = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = `creditflow-backup-${d}.json`;
  a.click();
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) {
    alert('El archivo excede el límite de 10 MB.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = validateBackup(JSON.parse(e.target.result));
      if (!confirm(`¿Importar ${imported.records.length} registros y ${imported.reports.length} reportes? Se reemplazarán los datos actuales.`)) return;
      const previous = {records:S.records, statuses:S.statuses, templates:S.templates, log:S.log, reports:S.reports, reportName:S.reportName};
      S.records = imported.records;
      S.statuses = migrateStatuses(imported.statuses);
      S.templates = imported.templates;
      S.log = imported.log;
      S.reports = imported.reports;
      S.reportName = imported.reportName;
      store.errors = store.errors.filter(key => !CF_STORAGE_KEYS.includes(key));
      if (!save()) {
        Object.assign(S, previous);
        return;
      }
      render();
      showToast('Respaldo importado correctamente.');
    } catch(error) {
      console.error('CreditFlow: importación rechazada', error);
      alert('No se importó el archivo: ' + error.message);
    } finally {
      input.value = '';
    }
  };
  reader.onerror = () => {
    alert('No se pudo leer el archivo seleccionado.');
    input.value = '';
  };
  reader.readAsText(file);
}

function validateBackup(data) {
  const isObject = value => value && typeof value === 'object' && !Array.isArray(value);
  const requireArray = (value, field, fallback) => {
    if (value === undefined && fallback) return JSON.parse(JSON.stringify(fallback));
    if (!Array.isArray(value)) throw new Error(`"${field}" debe ser una lista.`);
    return value;
  };
  const uniqueIds = (items, field) => {
    const ids = new Set();
    return items.map((item, index) => {
      if (!isObject(item)) throw new Error(`${field}[${index}] no es un objeto válido.`);
      if (item.id !== undefined && item.id !== null &&
          typeof item.id !== 'string' && typeof item.id !== 'number') {
        throw new Error(`${field}[${index}].id debe ser texto o número.`);
      }
      const id = item.id === undefined || item.id === null || item.id === ''
        ? makeId(field.slice(0, -1))
        : String(item.id);
      if (id.length > 200) throw new Error(`${field}[${index}].id excede 200 caracteres.`);
      if (ids.has(id)) throw new Error(`Hay identificadores repetidos en "${field}".`);
      ids.add(id);
      return {...item, id};
    });
  };
  const requireText = (value, field, max = 20000, optional = false) => {
    if (optional && (value === undefined || value === null)) return '';
    if (typeof value !== 'string' || value.length > max) throw new Error(`"${field}" debe ser texto de hasta ${max} caracteres.`);
    return value;
  };

  if (!isObject(data)) throw new Error('La raíz del archivo debe ser un objeto JSON.');
  const records = uniqueIds(requireArray(data.records, 'records'), 'records').map((record, index) => {
    const prefix = `records[${index}]`;
    const nombre = requireText(record.nombre, `${prefix}.nombre`, 500).trim();
    if (!nombre) throw new Error(`${prefix}.nombre no puede estar vacío.`);
    if (record.notes !== undefined && !Array.isArray(record.notes)) throw new Error(`${prefix}.notes debe ser una lista.`);
    const notes = (record.notes || []).map((note, noteIndex) => {
      if (!isObject(note)) throw new Error(`${prefix}.notes[${noteIndex}] no es válida.`);
      return {
        ...note,
        id: String(note.id ?? makeId('note')),
        text: requireText(note.text, `${prefix}.notes[${noteIndex}].text`),
        ts: requireText(note.ts, `${prefix}.notes[${noteIndex}].ts`, 100)
      };
    });
    for (const field of ['carta', 'cfbp', 'archived']) {
      if (record[field] !== undefined && typeof record[field] !== 'boolean') {
        throw new Error(`${prefix}.${field} debe ser verdadero o falso.`);
      }
    }
    return {
      ...record,
      id: record.id,
      nombre,
      nombreResp: requireText(record.nombreResp ?? 'Manuelbis', `${prefix}.nombreResp`, 500),
      estatus: requireText(record.estatus ?? '', `${prefix}.estatus`, 200),
      comentario: requireText(record.comentario ?? '', `${prefix}.comentario`),
      cartaFecha: requireText(record.cartaFecha ?? '', `${prefix}.cartaFecha`, 100),
      cfbpFecha: requireText(record.cfbpFecha ?? '', `${prefix}.cfbpFecha`, 100),
      link: requireText(record.link ?? '', `${prefix}.link`, 2000),
      phone: requireText(record.phone ?? '', `${prefix}.phone`, 100),
      notes
    };
  });
  records.forEach((record, index) => {
    if (record.link && !safePulseLink(record.link)) {
      throw new Error(`records[${index}].link debe ser una URL HTTPS válida de pulse.disputeprocess.com.`);
    }
  });

  const statuses = migrateStatuses(uniqueIds(
    requireArray(data.statuses, 'statuses', DEFAULT_STATUSES),
    'statuses'
  ).map((status, index) => {
    const label = requireText(status.label, `statuses[${index}].label`, 200).trim();
    if (!label) throw new Error(`statuses[${index}].label no puede estar vacío.`);
    if (typeof status.color !== 'string' || !/^#[\da-f]{6}$/i.test(status.color)) {
      throw new Error(`statuses[${index}].color debe ser un color hexadecimal válido.`);
    }
    if (status.numbered !== undefined && typeof status.numbered !== 'boolean') {
      throw new Error(`statuses[${index}].numbered debe ser verdadero o falso.`);
    }
    return {...status, label, numbered: Boolean(status.numbered)};
  }));
  const statusIds = new Set(statuses.map(status => status.id));
  records.forEach((record, index) => {
    if (record.estatus && !statusIds.has(record.estatus)) {
      throw new Error(`records[${index}] apunta a un estatus inexistente.`);
    }
  });
  const templates = uniqueIds(
    requireArray(data.templates, 'templates', DEFAULT_TEMPLATES),
    'templates'
  ).map((template, index) => {
    const label = requireText(template.label, `templates[${index}].label`, 500).trim();
    const msg = requireText(template.msg, `templates[${index}].msg`);
    const statusId = requireText(template.statusId ?? '', `templates[${index}].statusId`, 200);
    if (!label || !msg) throw new Error(`templates[${index}] requiere nombre y mensaje.`);
    if (statusId && !statusIds.has(statusId)) throw new Error(`templates[${index}] apunta a un estatus inexistente.`);
    return {...template, label, msg, statusId};
  });
  const log = uniqueIds(requireArray(data.log, 'log', []), 'log').map((entry, index) => ({
    ...entry,
    type: requireText(entry.type ?? '', `log[${index}].type`, 100),
    desc: requireText(entry.desc ?? '', `log[${index}].desc`),
    ts: requireText(entry.ts ?? '', `log[${index}].ts`, 100)
  }));
  const reports = uniqueIds(requireArray(data.reports, 'reports', []), 'reports').map((report, index) => {
    const prefix = `reports[${index}]`;
    if (!Number.isInteger(report.total) || report.total < 0) {
      throw new Error(`${prefix}.total debe ser un entero no negativo.`);
    }
    if (report.clients !== undefined && !Array.isArray(report.clients)) {
      throw new Error(`${prefix}.clients debe ser una lista.`);
    }
    const clients = (report.clients || []).map((client, clientIndex) => {
      if (!isObject(client)) throw new Error(`${prefix}.clients[${clientIndex}] no es válido.`);
      if (client.completed !== undefined && typeof client.completed !== 'boolean') {
        throw new Error(`${prefix}.clients[${clientIndex}].completed debe ser verdadero o falso.`);
      }
      return {
        nombre: requireText(client.nombre, `${prefix}.clients[${clientIndex}].nombre`, 500),
        estatus: requireText(client.estatus ?? '', `${prefix}.clients[${clientIndex}].estatus`, 200),
        completed: Boolean(client.completed)
      };
    });
    return {
      ...report,
      generatedAt: requireText(report.generatedAt, `${prefix}.generatedAt`, 100),
      reportDate: requireText(report.reportDate, `${prefix}.reportDate`, 100),
      reportName: report.reportName === undefined
        ? 'Nombre'
        : requireText(report.reportName, `${prefix}.reportName`, 100).trim() || 'Nombre',
      responsable: requireText(report.responsable, `${prefix}.responsable`, 500),
      total: report.total,
      content: requireText(report.content, `${prefix}.content`, 1000000),
      clients
    };
  });
  const reportName = data.reportName === undefined
    ? 'Nombre'
    : requireText(data.reportName, 'reportName', 100).trim() || 'Nombre';
  return {records, statuses, templates, log, reports, reportName};
}

// ─── NOTES ───
function showNotesModal(recordId) {
  const r = S.records.find(x => x.id === recordId);
  if (!r) return;
  if (!r.notes) r.notes = [];
  // Migrate old comentario to first note
  if (r.comentario && r.notes.length === 0) {
    r.notes.push({id:'n0', text:r.comentario, ts: r.createdAt || new Date().toISOString()});
  }
  function renderNotesList() {
    return r.notes.slice().reverse().map(n => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="flex:1">
          <div style="font-size:12px;color:var(--text-3);margin-bottom:4px">${escapeHtml(fmtTime(n.ts))} · ${escapeHtml(fmtDate(n.ts.slice(0, 10)))}</div>
          <div style="font-size:13px;color:var(--text);white-space:pre-wrap">${escapeHtml(n.text)}</div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="deleteNote(decodeEventId('${eventId(recordId)}'),decodeEventId('${eventId(n.id)}'))">🗑️</button>
      </div>`).join('') || '<p style="color:var(--text-3);text-align:center;padding:16px 0">Sin notas</p>';
  }
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="closeModal()"><div class="modal modal-wide" onclick="event.stopPropagation()">
    <h3>Notas — ${escapeHtml(r.nombre)}</h3>
    <div id="notes-list" style="max-height:260px;overflow-y:auto;margin-bottom:14px">${renderNotesList()}</div>
    <div class="fg full" style="margin-bottom:10px">
      <label class="fl">Nueva nota</label>
      <textarea class="ft" id="new-note-text" style="min-height:70px" placeholder="Escribe una nota..."></textarea>
    </div>
    <div class="f-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="addNote(decodeEventId('${eventId(recordId)}'))">Guardar nota</button>
    </div>
  </div></div>`;
}
function addNote(recordId) {
  const text = document.getElementById('new-note-text').value.trim();
  if (!text) return;
  const r = S.records.find(x => x.id === recordId);
  if (!r) return;
  if (!r.notes) r.notes = [];
  r.notes.push({id: makeId('note'), text, ts: new Date().toISOString()});
  save();
  showNotesModal(recordId);
}
function deleteNote(recordId, noteId) {
  const r = S.records.find(x => x.id === recordId);
  if (!r || !r.notes) return;
  if (!confirm('¿Eliminar esta nota?')) return;
  r.notes = r.notes.filter(n => n.id !== noteId);
  save();
  showNotesModal(recordId);
}

function syncFromGM() {
  const records = store.get('cf_records', []);
  const log = store.get('cf_log', []);
  const statuses = store.get('cf_statuses', JSON.parse(JSON.stringify(DEFAULT_STATUSES)));
  const templates = store.get('cf_templates', JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)));
  const reports = store.get('cf_reports', []);
  const reportName = store.get('cf_report_name', 'Nombre');
  if (typeof reportName !== 'string') {
    store.errors.push('cf_report_name');
    console.error('CreditFlow: no se sincronizó el nombre del reporte porque tiene un formato inválido.');
    showToast('No se sincronizó el nombre del reporte: el valor guardado no es válido.', 'var(--red)');
    return;
  }
  const collections = [records, log, statuses, templates, reports];
  if (!collections.every(Array.isArray) ||
      !collections.every(items => items.every(item => item && typeof item === 'object' && !Array.isArray(item)))) {
    collections.forEach((items, index) => {
      if (!Array.isArray(items) || items.some(item => !item || typeof item !== 'object' || Array.isArray(item))) {
        store.errors.push(CF_STORAGE_KEYS[index]);
      }
    });
    console.error('CreditFlow: no se sincronizaron los datos porque una colección está dañada.');
    showToast('No se sincronizaron los datos: una colección tiene un formato inválido.', 'var(--red)');
    return;
  }
  S.records = records.filter(r => r && typeof r === 'object' && !Array.isArray(r)).map(r => ({
    ...r, id: String(r.id ?? makeId('record')), nombre: String(r.nombre ?? ''),
    nombreResp: String(r.nombreResp || 'Manuelbis'), estatus: String(r.estatus || ''),
    carta: Boolean(r.carta), cartaFecha: String(r.cartaFecha || ''),
    cfbp: Boolean(r.cfbp), cfbpFecha: String(r.cfbpFecha || ''),
    archived: Boolean(r.archived),
    comentario: String(r.comentario || ''), link: String(r.link || ''),
    phone: String(r.phone || ''), createdAt: String(r.createdAt || ''),
    notes: Array.isArray(r.notes) ? r.notes.filter(n => n && typeof n === 'object' && !Array.isArray(n)).map(n => ({
      ...n, id: String(n.id ?? makeId('note')), text: String(n.text || ''),
      ts: String(n.ts || r.createdAt || new Date().toISOString())
    })) : []
  }));
  S.records = ensureUniqueIds(S.records, 'record');
  S.log = log.filter(item => item && typeof item === 'object' && !Array.isArray(item)).map(item => ({
    ...item, id: String(item.id ?? makeId('log')), type: String(item.type || ''),
    desc: String(item.desc || ''), ts: String(item.ts || new Date().toISOString())
  }));
  S.log = ensureUniqueIds(S.log, 'log');
  S.statuses = migrateStatuses(statuses);
  S.templates = templates.filter(item => item && typeof item === 'object' && !Array.isArray(item)).map(item => ({
    ...item, id: String(item.id ?? makeId('template')), statusId: String(item.statusId || ''),
    label: String(item.label || ''), msg: String(item.msg || '')
  }));
  S.templates = ensureUniqueIds(S.templates, 'template');
  S.reports = reports.filter(item => item && typeof item === 'object' && !Array.isArray(item)).map(report => ({
    ...report,
    id: String(report.id ?? makeId('report')),
    generatedAt: String(report.generatedAt || ''),
    reportDate: String(report.reportDate || ''),
    reportName: String(report.reportName || 'Nombre'),
    responsable: String(report.responsable || 'Todos'),
    total: Number.isInteger(report.total) && report.total >= 0 ? report.total : 0,
    content: String(report.content || ''),
    clients: Array.isArray(report.clients) ? report.clients.filter(client => client && typeof client === 'object' && !Array.isArray(client)).map(client => ({
      nombre: String(client.nombre || 'Sin nombre'),
      estatus: String(client.estatus || ''),
      completed: Boolean(client.completed)
    })) : []
  }));
  S.reports = ensureUniqueIds(S.reports, 'report');
  S.reportName = reportName.trim() || 'Nombre';
  document.getElementById('storage-label').textContent =
    store.isGM() ? 'Datos en Tampermonkey (GM)' : 'Datos en este navegador (no sincroniza con GM)';
  render();
}

let syncTimer;
let gmListenersRegistered = false;
function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncFromGM, 40);
}

// Sync every CRM collection when another tab writes through Tampermonkey.
function registerGMListeners() {
  if (gmListenersRegistered || typeof GM_addValueChangeListener === 'undefined') return;
  gmListenersRegistered = true;
  CF_STORAGE_KEYS.forEach(key => {
    GM_addValueChangeListener(key, (_key, _old, _new, remote) => {
      if (remote) scheduleSync();
    });
  });
}
registerGMListeners();
function checkCreditFlowUpdate() {
  if (typeof CreditFlowCheckLatest === 'function') CreditFlowCheckLatest();
}
window.addEventListener('cr-gm-ready', checkCreditFlowUpdate);
checkCreditFlowUpdate();
setInterval(checkCreditFlowUpdate, 10 * 60 * 1000);
// On page load GM may not be exposed yet; attach the listeners when the bridge signals ready.
window.addEventListener('cr-gm-ready', () => {
  registerGMListeners();
  scheduleSync();
});
// Synchronize localStorage tabs and refresh hidden GM tabs on return.
window.addEventListener('storage', event => {
  if (!store.isGM() && CF_STORAGE_KEYS.includes(event.key)) scheduleSync();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) scheduleSync();
});
if (store.errors.some(key => CF_STORAGE_KEYS.includes(key))) {
  showToast('Hay datos locales que no se pudieron leer; no se guardarán cambios para protegerlos.', 'var(--red)');
}
</script>
